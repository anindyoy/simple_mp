name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    environment: Telegram

    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:lts
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_test
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
        extensions: mbstring, bcmath, exif, pcntl, gd, intl, zip, pdo_mysql
        coverage: none
    - uses: actions/checkout@v4

    - name: Copy .env
      run: |
        php -r "file_exists('.env') || copy('.env.example', '.env');"
        chmod 600 .env

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Directory Permissions
      run: |
        mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache
        chmod -R 775 storage bootstrap/cache

    - name: Generate key
      run: php artisan key:generate

    - name: Run Migrations
      run: php artisan migrate --force

    - name: Install Socket CLI
      run: npm install -g socket

    - name: Install NPM Dependencies
      run: npm ci

    - name: Build Frontend Assets
      run: npm run build

    - name: Security audit
      env:
        APP_ENV: production
        APP_DEBUG: "false"
        APP_URL: https://example.com
        SESSION_SECURE_COOKIE: "true"
      run: php artisan checkpoint:scan --json | tee checkpoint-report.json

    - name: Upload security audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checkpoint-report
        path: checkpoint-report.json
        retention-days: 7

    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      id: tests
      continue-on-error: true
      run: |
        set -o pipefail
        php artisan test --parallel --processes=4 --no-ansi 2>&1 | tee test-results.txt
        EXIT_CODE=$?
        sed -i 's/\x1b\[[0-9;]*[A-Za-z]//g' test-results.txt
        echo "test_exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
        exit $EXIT_CODE

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results.txt
        retention-days: 7

    - name: Send Telegram Notification
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TESTS_FAILED: ${{ steps.tests.outcome == 'failure' }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "⚠️ Telegram secrets not configured, skipping notification. Run ID: ${GITHUB_RUN_ID}"
          exit 0
        fi

        if [ "$TESTS_FAILED" = "true" ]; then
          FAILED_TESTS=$(grep "FAILED" test-results.txt | head -20)
          SUMMARY=$(grep -E "^\s*(Tests|Duration):" test-results.txt | tail -2)
          TEST_OUTPUT="$(printf 'Test gagal:\n%s\n\n%s' "${FAILED_TESTS}" "${SUMMARY}")"
          TEST_OUTPUT=$(printf '%s' "${TEST_OUTPUT}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          DETAIL="<pre>${TEST_OUTPUT}</pre>"
        else
          DETAIL="⚠️ Sebuah step workflow gagal. Lihat <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">log run</a> untuk detail."
        fi

        PAYLOAD=$(jq -n \
          --arg chat_id "${TELEGRAM_CHAT_ID}" \
          --arg text "$(printf '❌ <b>CI Failed</b>\nRepo: <a href="https://github.com/%s">%s</a>\nBranch: <code>%s</code>\nCommit: <a href="https://github.com/%s/commit/%s"><code>%s</code></a>\n\n%s' \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_SHA}" \
            "${GITHUB_SHA:0:7}" \
            "${DETAIL}")" \
          '{
            chat_id: $chat_id,
            parse_mode: "HTML",
            text: $text
          }')

        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}"

        if [ "$TESTS_FAILED" = "true" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@test-results.txt;filename=test-results.txt" \
            -F "caption=📄 Full test output — ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}"
        fi

    - name: Fail job if tests failed
      if: steps.tests.outcome == 'failure'
      run: exit 1